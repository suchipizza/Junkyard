# TEST FIXTURE. Not a real brick. Shaped like the PRD 5.1 example so the
# schema and reference checks run against a realistic manifest. Numbers here
# are brick design params, not component dimensions.
id: gripper.fixture_parallel_jaw
schema_version: 0.2.0
updated_at: 2026-11-07
name: Fixture parallel jaw gripper
category: gripper
stage: experimental
summary: Test fixture with two jaws on racks driven by one servo pinion.
description_md: README.md
functions: [grip_parallel, grip_fragile_irregular]
mdi: { realizes: mech.fixture_parallel_jaw, families: [F12, F06] }
tags: [servo, gripper, beginner]
difficulty: beginner
actuation:
  accepts_classes: [hobby_servo_9g, hobby_servo_standard]
  default_part: part.servo.fixture_micro
params:
  - name: opening_mm
    type: float
    unit: mm
    default: 40
    range: [20, 70]
    description: Maximum distance between jaw faces.
  - name: pinion_teeth
    type: int
    default: 16
    range: [12, 24]
  - name: servo
    type: part_ref
    default: part.servo.fixture_micro
    allowed_classes: [hobby_servo_9g, hobby_servo_standard]
  - name: clearance_mm
    type: float
    unit: mm
    default: 0.25
    range: [0.1, 0.6]
    description: Sliding-fit clearance; tune to your printer.
  - name: jaw_style
    type: enum
    options: [flat, v_groove]
    default: flat
  - name: material
    type: material
    default: PETG
    options: [PLA, PETG]
derived:
  - { name: stroke_mm, unit: mm, expr: "opening_mm" }
  - { name: half_stroke_mm, unit: mm, expr: "stroke_mm / 2" }
  - { name: envelope_mm, unit: mm, from: bbox }
outputs: [base, pinion, jaw_left, jaw_right]
ports:
  - name: servo_body
    type: servo_body_mount
    gender: female
    params_from: servo
    frame: { origin_mm: [0, 0, 0], z_axis: [0, 0, 1], x_axis: [1, 0, 0] }
  - name: jaw_left_face
    type: finger_mount_m3_pair
    gender: female
    params: { spacing_mm: 10 }
    frame: { origin_mm: [-20, 0, 30], z_axis: [1, 0, 0], x_axis: [0, 0, 1] }
  - name: base_mount
    type: bolt_pattern
    gender: female
    params: { screw: M3, count: 4, pitch_x_mm: 30, pitch_y_mm: 20 }
    frame: { origin_mm: [0, 0, -5], z_axis: [0, 0, -1], x_axis: [1, 0, 0] }
print_hints:
  material: [PETG, PLA]
  layer_height_mm: 0.2
  infill_percent: 30
  supports: none
  orientation: { base: bottom_down, racks: flat }
bom:
  - { part: "@servo", qty: 1 }
  - { part: part.screw.fixture_m3, qty: 6 }
assembly_steps:
  - Center the servo before fitting the pinion.
  - Slide the racks in and check they move freely.
pairs_well_with: [gripper.fixture_finger]
visuals:
  hero_params: [opening_mm]
  color_roles: { input: [pinion], output: [jaw_left, jaw_right], fixed: [base] }
provenance:
  origin: original
  authors: ["Junkyard contributors"]
  inspired_by: []
  imported_files: []
license: { code: Apache-2.0, data: CC-BY-4.0 }
